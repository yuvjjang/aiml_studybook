format:
  html:
    theme:
      dark: [slate, custom.scss]
      light: [flatly, custom.scss]
    css: styles.css
    toc: true
    toc-depth: 3
    toc-title: "이 페이지"
    number-sections: true
    code-fold: true
    code-summary: "코드 보기"
    code-tools: true
    highlight-style: dracula
    fig-align: center
    html-math-method: mathjax
    smooth-scroll: true
    anchor-sections: true

jupyter: ai-ml-study

execute:
  echo: true
  warning: false
  freeze: auto
