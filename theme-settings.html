<!-- 읽기 설정을 모든 페이지에 적용한다 (settings.qmd 에서 조절) -->
<script>
/* 읽기 설정을 모든 페이지에 적용한다.
 *
 * settings.qmd 에서 저장한 값을 localStorage 에서 읽어,
 * <html> 의 --reader-user-* 인라인 스타일로 넣는다.
 * styles.css 의 body 규칙이 user 값이 있으면 그것을, 없으면
 * 테마 기본값을 쓰도록 var() 로 합친다.
 * 값은 브라우저에만 저장되며 서버로 가지 않는다.
 *
 * <head> 에서 동기 실행되므로 본문이 그려지기 전에 적용된다
 * (색이 번쩍이는 것을 막는다).
 */
(function () {
  "use strict";

  var KEY = "aimlstudy.reader";

  // settings.qmd 와 공유하는 스키마. 저장 키 -> 실제로 쓸 CSS 변수
  var FIELDS = {
    "--reader-text": "--reader-user-text",
    "--reader-bg": "--reader-user-bg",
    "--reader-link": "--reader-user-link",
    "--reader-muted": "--reader-user-muted",
    "--reader-font": "--reader-user-font",
    "--reader-font-size": "--reader-user-font-size",
    "--reader-line-height": "--reader-user-line-height",
    "--reader-measure": "--reader-user-measure"
  };

  function read() {
    try {
      var raw = window.localStorage.getItem(KEY);
      return raw ? JSON.parse(raw) : {};
    } catch (e) {
      return {};                 // 사생활 보호 모드 등에서 접근이 막히는 경우
    }
  }

  function apply(cfg) {
    var root = document.documentElement;
    Object.keys(FIELDS).forEach(function (k) {
      if (cfg && typeof cfg[k] === "string" && cfg[k] !== "") {
        root.style.setProperty(FIELDS[k], cfg[k]);
      } else {
        root.style.removeProperty(FIELDS[k]);
      }
    });
  }

  function save(cfg) {
    try {
      window.localStorage.setItem(KEY, JSON.stringify(cfg || {}));
      return true;
    } catch (e) {
      return false;              // 저장할 수 없으면 이번 세션에만 적용된다
    }
  }

  // settings.qmd 가 쓰는 최소 API
  window.readerSettings = {
    key: KEY,
    fields: Object.keys(FIELDS),
    get: read,
    apply: apply,                          // 저장 없이 이 페이지에만 미리보기
    save: function (cfg) {                 // 저장 + 모든 페이지에 적용
      var ok = save(cfg);
      apply(cfg);
      return ok;
    },
    reset: function () {
      try { window.localStorage.removeItem(KEY); } catch (e) { /* noop */ }
      apply({});
    }
  };

  apply(read());
})();
</script>
